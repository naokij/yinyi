version: '3.8'

services:
  # Apple Silicon Mac 专用配置 - 使用 Ollama 支持 Metal 加速
  ollama:
    image: ollama/ollama:latest
    container_name: yinyi-ollama
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # 注意：Ollama 容器内会自动检测并使用 Metal（如果在 Mac 上直接运行）
    # 但在 Docker Desktop for Mac 中，Metal 加速仍然受限
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yinyi-backend
    volumes:
      - ./data:/app/data
      - ${PHOTOS_DIR:-./photos}:/app/photos:ro
      - ./fonts:/app/fonts:ro
      - ./templates:/app/templates
      - ./exports:/app/exports
    ports:
      - "8765:8765"
    environment:
      - AI_BACKEND=ollama  # 标记使用 ollama
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite:///app/data/yinyi.db
      - PHOTOS_DIR=/app/photos
      - EXPORTS_DIR=/app/exports
      - FONTS_DIR=/app/fonts
      - TEMPLATES_DIR=/app/templates
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: yinyi-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
